services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prbotbenchmark
      POSTGRES_USER: prbotbenchmark
      POSTGRES_PASSWORD: prbotbenchmark
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prbotbenchmark"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
